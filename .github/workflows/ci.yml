name: ci
# `push` limite a main, sinon chaque branche de PR declenche DEUX fois le meme job — une
# fois pour le push, une fois pour la PR — sur exactement le meme commit.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Le `dist/` deja verifie est celui qu'on deploie : pas de second build.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 1 }

  # Publie sur Cloudflare a chaque push sur main, seulement si build et tests passent.
  # Secrets du depot requis : CLOUDFLARE_API_TOKEN (droit « Workers Scripts: Edit ») et
  # CLOUDFLARE_ACCOUNT_ID.
  deploie:
    needs: verifie
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deux merges rapproches : le second attend le premier plutot que de le couper.
    concurrency: { group: deploie-production, cancel-in-progress: false }
    environment:
      name: production
      url: ${{ steps.wrangler.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - id: wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.157.0
          command: deploy
